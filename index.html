<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Exact KB Image Compressor — Open Source Demo by KB Photo Resizer</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 540px; margin: 40px auto; padding: 0 16px; color: #111; }
    .card { border: 1px solid #e5e7eb; border-radius: 8px; padding: 20px; }
    input, button { margin-top: 10px; display: block; width: 100%; padding: 8px; box-sizing: border-box; }
    button { background: #111; color: #fff; border: none; border-radius: 6px; cursor: pointer; font-weight: 600; }
    .note { font-size: 0.85rem; color: #555; margin-top: 16px; }
  </style>
</head>
<body>
  <div class="card">
    <h2>Exact KB Image Compressor (Client-Side Demo)</h2>
    <p>Compress any JPG/PNG to a target KB limit directly in your browser.</p>
    <input type="file" id="fileInput" accept="image/*" />
    <label for="targetKb">Target Size (KB):</label>
    <input type="number" id="targetKb" value="50" min="5" max="2000" />
    <button id="compressBtn">Compress & Download</button>
    <p id="status"></p>
    <p class="note">
      Need batch resizing, DPI control, or preset exam sizes (20KB, 50KB, 100KB)? 
      Use the full web app at <a href="https://kbphotoresizer.com">KB Photo Resizer</a>.
    </p>
  </div>

  <script>
    document.getElementById('compressBtn').addEventListener('click', async () => {
      const file = document.getElementById('fileInput').files[0];
      const targetBytes = Number(document.getElementById('targetKb').value) * 1024;
      const status = document.getElementById('status');
      if (!file) return (status.textContent = 'Please select an image first.');

      const img = new Image();
      img.src = URL.createObjectURL(file);
      await img.decode();

      const canvas = document.createElement('canvas');
      canvas.width = img.width;
      canvas.height = img.height;
      canvas.getContext('2d').drawImage(img, 0, 0);

      let low = 0.05, high = 0.95, bestBlob = null;
      for (let i = 0; i < 7; i++) {
        const mid = (low + high) / 2;
        const blob = await new Promise((r) => canvas.toBlob(r, 'image/jpeg', mid));
        if (blob.size <= targetBytes) {
          bestBlob = blob;
          low = mid;
        } else {
          high = mid;
        }
      }

      if (!bestBlob) {
        bestBlob = await new Promise((r) => canvas.toBlob(r, 'image/jpeg', 0.05));
      }

      const a = document.createElement('a');
      a.href = URL.createObjectURL(bestBlob);
      a.download = `compressed-${Math.round(bestBlob.size / 1024)}kb.jpg`;
      a.click();
      status.textContent = `Done! Final size: ${(bestBlob.size / 1024).toFixed(1)} KB`;
    });
  </script>
</body>
</html>
